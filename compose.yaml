name: centerseat

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      CENTERSEAT_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: backend
    environment:
      CENTERSEAT_HTTP_ADDR: :8080
      DATABASE_URL: postgres://centerseat:centerseat@postgres:5432/centerseat?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CENTERSEAT_PROVIDER_MODE: demo
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/centerseat-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: centerseat
      POSTGRES_USER: centerseat
      POSTGRES_PASSWORD: centerseat
    volumes:
      - centerseat-postgres:/var/lib/postgresql/data
      - ./backend/migrations/000001_core.up.sql:/docker-entrypoint-initdb.d/000001_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centerseat -d centerseat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - centerseat-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  centerseat-postgres:
  centerseat-redis:
