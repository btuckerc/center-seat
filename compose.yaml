name: centerseat

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      CENTERSEAT_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: backend
    environment:
      CENTERSEAT_HTTP_ADDR: :8080
      CENTERSEAT_ENV: production
      CENTERSEAT_PROVIDER_MODE: vista
      VISTA_API_BASE_URL: ${VISTA_API_BASE_URL:?required}
      VISTA_AUTH_URL: ${VISTA_AUTH_URL:?required}
      VISTA_CLIENT_ID: ${VISTA_CLIENT_ID:?required}
      VISTA_USERNAME: ${VISTA_USERNAME:?required}
      VISTA_PASSWORD: ${VISTA_PASSWORD:?required}
      VISTA_REGION_CODE: ${VISTA_REGION_CODE:-}
      VISTA_SITE_IDS: ${VISTA_SITE_IDS:-}
      VISTA_BOOKING_URL_TEMPLATE: ${VISTA_BOOKING_URL_TEMPLATE:-}
      DATABASE_URL: postgres://centerseat:${POSTGRES_PASSWORD:?required}@postgres:5432/centerseat?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/centerseat-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: centerseat
      POSTGRES_USER: centerseat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - centerseat-postgres:/var/lib/postgresql/data
      - ./backend/migrations/000001_core.up.sql:/docker-entrypoint-initdb.d/000001_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centerseat -d centerseat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - centerseat-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  centerseat-postgres:
  centerseat-redis:
