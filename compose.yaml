name: centerseat

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      CENTERSEAT_API_URL: http://api:8080
      CENTERSEAT_TRENDING_TIMEOUT_MS: ${CENTERSEAT_TRENDING_TIMEOUT_MS:-4000}
      CENTERSEAT_AGENT_TOKEN: ${CENTERSEAT_AGENT_TOKEN:-}
      CENTERSEAT_PUBLIC_URL: ${CENTERSEAT_PUBLIC_URL:-}
      OPEN_CINEMA_API_BASE_URL: ${OPEN_CINEMA_API_BASE_URL:-https://opencinema.app}
      OPEN_CINEMA_API_KEY: ${OPEN_CINEMA_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: backend
    environment:
      CENTERSEAT_HTTP_ADDR: :8080
      CENTERSEAT_ENV: ${CENTERSEAT_ENV:-production}
      CENTERSEAT_PROVIDER_MODE: ${CENTERSEAT_PROVIDER_MODE:-opencinema}
      OPEN_CINEMA_API_BASE_URL: ${OPEN_CINEMA_API_BASE_URL:-https://opencinema.app}
      OPEN_CINEMA_API_KEY: ${OPEN_CINEMA_API_KEY:-}
      ATOM_API_BASE_URL: ${ATOM_API_BASE_URL:-https://api.atomtickets.com}
      ATOM_API_KEY: ${ATOM_API_KEY:-}
      ATOM_PARTNER_ID: ${ATOM_PARTNER_ID:-}
      FANDANGO_BASE_URL: ${FANDANGO_BASE_URL:-https://www.fandango.com}
      FANDANGO_MINIMUM_DELAY_MS: ${FANDANGO_MINIMUM_DELAY_MS:-50}
      FANDANGO_MAX_CONCURRENCY: ${FANDANGO_MAX_CONCURRENCY:-8}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/centerseat-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
